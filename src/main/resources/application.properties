spring.application.name=IronVault

# Keep the JPA session closed after the service layer
spring.jpa.open-in-view=false

# For production: disable the /v3/api-docs endpoint
# springdoc.api-docs.enabled=false

# Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
# Not needed since we are using interceptors to log all kinds of SQL queries (not only JPA)
# spring.jpa.show-sql=true
# Not needed
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Enable logging for datasource-proxy
logging.level.net.ttddyy.dsproxy.listener=debug
